# Front-end assets for the engine's templates. Structure and behaviour only;
# brand (fonts, colours, spacing) is the theme's. Attached from render arrays
# (event nodes, home, sources, methodology, suggestion thanks), never from a
# theme, so a site works with any theme.
engine:
  version: 1.x
  css:
    base:
      css/engine.css: {}
  js:
    js/engine.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings
